name: Flatpak channel install

# Channel-health canary: installs the published Flatpak from the live Pages
# repository inside distro containers and round-trips the host wrapper
# installer (see scripts/check-flatpak-channel-install.sh). Runs weekly and
# on demand — it tests the deployed channel against current distro flatpak
# stacks, so commits do not change its outcome; Pages deployments, flathub
# runtime updates, and distro flatpak/bubblewrap drift do.

on:
  schedule:
    - cron: "57 6 * * 1"
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario: [fedora, ubuntu-lts, arch]
    steps:
      - uses: actions/checkout@v7
      - name: Install published Flatpak in ${{ matrix.scenario }} scenario
        run: scripts/check-flatpak-channel-install.sh "${{ matrix.scenario }}"
