name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-python-package-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build cibuildwheel twine

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib
          from pathlib import Path

          release_tag = os.environ["RELEASE_TAG"]
          normalized_tag = release_tag.removeprefix("v")
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = pyproject["project"]["version"]

          if normalized_tag != package_version:
              print(
                  "Release tag does not match package version: "
                  f"tag={release_tag!r}, pyproject={package_version!r}",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Build source package
        run: python -m build --sdist --outdir dist

      - name: Build manylinux wheel
        env:
          PENGUIN_BURNER_REQUIRE_NATIVE_LAYER: "1"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_BUILD: "cp312-manylinux_x86_64"
          CIBW_ENVIRONMENT: "PENGUIN_BURNER_REQUIRE_NATIVE_LAYER=1 PENGUIN_BURNER_REQUIRE_NATIVE_LAYER32=1 PENGUIN_BURNER_REQUIRE_NVAPI_SHIM=1 PENGUIN_BURNER_REQUIRE_DAEMON=1 CARGO_HOME=/opt/rust/cargo RUSTUP_HOME=/opt/rust/rustup PATH=/opt/rust/cargo/bin:$PATH"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: |
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y epel-release
              dnf install -y vulkan-headers mingw64-gcc-c++ mingw64-winpthreads-static glibc-devel.i686 libstdc++-devel.i686
            else
              yum install -y epel-release
              yum install -y vulkan-headers mingw64-gcc-c++ mingw64-winpthreads-static glibc-devel.i686 libstdc++-devel.i686
            fi
            export RUSTUP_HOME=/opt/rust/rustup CARGO_HOME=/opt/rust/cargo
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.82.0 --no-modify-path
        run: python -m cibuildwheel --platform linux --output-dir dist

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Check required native payloads
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          required = {
              "Vulkan layer": "overlay/native_layer/libVkLayer_penguinburner_latency.so",
              "NVAPI shim": "overlay/nvapi_shim/nvapi64.dll",
              "burnerd": "runtime/daemon_bin/penguin-burnerd",
          }
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              for label, suffix in required.items():
                  if not any(name.endswith(suffix) for name in names):
                      raise SystemExit(f"missing required {label}: {suffix}")
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
