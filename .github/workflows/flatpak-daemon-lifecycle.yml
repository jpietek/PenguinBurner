name: Flatpak daemon lifecycle

# Rehearses the Flatpak elevated daemon-install transaction end to end in a
# systemd container (see scripts/check-flatpak-daemon-lifecycle.sh): the real
# tree-rendered transaction, the real tree-built daemon, real systemd and
# socket — enable/restart/wait, peer-UID gate, idempotence, legacy-unit
# migration, and the failure path's rollback. Mock GPU, no polkit.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "7 7 * * 1"
  workflow_dispatch:

jobs:
  rehearse:
    name: Daemon lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Rehearse the daemon-install transaction
        run: scripts/check-flatpak-daemon-lifecycle.sh
