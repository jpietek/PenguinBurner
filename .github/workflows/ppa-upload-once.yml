name: Upload PPA source packages once

on:
  push:
    branches:
      - ppa-upload-0.1.5

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out signed source packages
        uses: actions/checkout@v4

      - name: Install dput
        run: |
          sudo apt-get update
          sudo apt-get install -y dput-ng

      - name: Configure Launchpad PPA upload
        run: |
          mkdir -p "$HOME/.dput.d/profiles"
          cat > "$HOME/.dput.d/profiles/penguin-ppa.json" <<'JSON'
          {
            "fqdn": "ppa.launchpad.net",
            "incoming": "~jpietek/penguin-burner/ubuntu/",
            "login": "anonymous",
            "meta": "boring",
            "method": "ftp",
            "passive_ftp": true,
            "ftp": {
              "timeout": 120
            }
          }
          JSON

      - name: Upload and save diagnostics
        continue-on-error: true
        run: |
          set +e
          mkdir -p dist/upload-logs
          log="dist/upload-logs/github-ppa-upload-${GITHUB_RUN_ID}.log"
          {
            echo "date: $(date -u --iso-8601=seconds)"
            echo "runner: $(uname -a)"
            echo
            echo "== DNS =="
            getent ahostsv4 ppa.launchpad.net || true
            echo
            echo "== FTP banner probe =="
            timeout 30 bash -c 'exec 3<>/dev/tcp/ppa.launchpad.net/21; dd bs=1 count=120 <&3 2>/dev/null | cat -v' || true
            echo
            echo "== dput check-only questing =="
            dput --unchecked --check-only ppa:jpietek/penguin-burner dist/deb/questing/penguin-burner_0.1.5-1~ppa1~questing1_source.changes
            echo "check-only exit: $?"
            echo
            echo "== dput upload questing =="
            timeout 180 dput --unchecked --passive ppa:jpietek/penguin-burner dist/deb/questing/penguin-burner_0.1.5-1~ppa1~questing1_source.changes
            questing_status=$?
            echo "questing upload exit: ${questing_status}"
            echo
            if [ "${questing_status}" -eq 0 ]; then
              echo "== dput upload resolute =="
              timeout 180 dput --unchecked --passive ppa:jpietek/penguin-burner dist/deb/resolute/penguin-burner_0.1.5-1~ppa1~resolute1_source.changes
              resolute_status=$?
              echo "resolute upload exit: ${resolute_status}"
            else
              resolute_status=99
              echo "skipping resolute because questing upload failed"
            fi
            echo
            echo "final status: questing=${questing_status} resolute=${resolute_status}"
          } 2>&1 | tee "$log"

      - name: Push diagnostics
        if: always()
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/upload-logs/
          git commit -m "Record PPA upload diagnostics ${GITHUB_RUN_ID}" || exit 0
          git push
