name: Flatpak host-python compatibility

# The Flatpak's pkexec elevation runs runtime.daemon_client on the HOST
# python with the Flatpak's site-packages on PYTHONPATH (see
# scripts/check-flatpak-host-python.sh). This proves the elevated import
# closure stays pure-python/stdlib and runs under each supported host
# distro's python, down to the requires-python floor (debian-12 / 3.11).

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "52 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    name: Host Python (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [debian-12, ubuntu-lts, fedora, arch]
    steps:
      - uses: actions/checkout@v7
      - name: Check host-python compatibility in ${{ matrix.scenario }} scenario
        run: scripts/check-flatpak-host-python.sh "${{ matrix.scenario }}"
