name: Deploy Flatpak repository to Pages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag containing the signed Pages snapshot
        required: true
        type: string

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy signed snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out snapshot validator
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download and validate release snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/flatpak_pages_artifact.py check-tag "$RELEASE_TAG"
          archive="PenguinBurner-pages-${RELEASE_TAG}.tar.gz"
          mkdir downloads
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" \
            --pattern "$archive.sha256" \
            --dir downloads
          test -f "downloads/$archive"
          test -f "downloads/$archive.sha256"
          python3 scripts/flatpak_pages_artifact.py extract \
            "downloads/$archive" \
            site \
            --checksum "downloads/$archive.sha256"

      - name: Add project research pages
        run: |
          set -euo pipefail
          source_page="docs/pages/amd-rdna-undervolting/index.html"
          target_page="site/amd-rdna-undervolting/index.html"
          test -s "$source_page"
          install -Dm0644 "$source_page" "$target_page"
          cmp --silent "$source_page" "$target_page"
          source_page="docs/pages/pr72-curve-comparison/index.html"
          target_page="site/pr72-curve-comparison/index.html"
          test -s "$source_page"
          install -Dm0644 "$source_page" "$target_page"
          cmp --silent "$source_page" "$target_page"
          python3 scripts/flatpak_pages_artifact.py validate site

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
