[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "penguin-burner"
version = "0.1.6"
description = "NVIDIA GPU automatic undervolting tool with precision V/F tuning, MSI Afterburner imports, and LACT exports"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "PenguinBurner contributors" },
]
keywords = [
  "nvidia",
  "undervolting",
  "linux",
  "gpu",
  "q2rtx",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Hardware",
]
dependencies = [
  "PySide6>=6.7",
  "colorama>=0.4",
  "pyqtgraph>=0.13",
]

[project.optional-dependencies]
ui = [
  # Compatibility alias for older docs/users. GUI dependencies are installed by
  # the base package too, so plain `pip install penguin-burner` is enough.
  "PySide6>=6.7",
  "colorama>=0.4",
  "pyqtgraph>=0.13",
]

[project.urls]
Homepage = "https://github.com/jpietek/PenguinBurner"
Issues = "https://github.com/jpietek/PenguinBurner/issues"
Source = "https://github.com/jpietek/PenguinBurner"

[project.scripts]
penguin-burner = "ui:main"
pburn = "ui:main"
penguin-burner-ui = "ui:main"
pburn-ui = "ui:main"
penguin-burner-cli = "penguin_burner:cli_main"
pburn-cli = "penguin_burner:cli_main"
q2rtx-stability = "stability.q2rtx:main"
cuda-bruteforce-stability = "stability.cuda_bruteforce:main"
penguin-burner-import-afterburner-vf = "afterburner.import_vf_curve:main"
penguin-burner-import-afterburner-fan = "afterburner.import_fan_curve:main"

[tool.setuptools]
py-modules = [
  "ascii_chart",
  "cli_output",
  "cuda_bruteforce_stability",
  "dry_run_preview",
  "hidden_nvapi_voltage",
  "hidden_nvapi_vf",
  "hidden_nvml_voltage",
  "import_afterburner_fan_curve",
  "import_afterburner_vf_curve",
  "nvidia_runtime_defaults",
  "nvml_gpu_policy",
  "penguin_burner",
  "penguin_burner_errors",
  "penguin_burner_paths",
  "q2rtx_stability",
  "runtime_debug",
  "runtime_service",
  "subprocess_locale",
]
packages = [
  "afterburner",
  "auto_uv3",
  "auto_uv3.curve",
  "auto_uv3.final_verification",
  "auto_uv3.gpu",
  "auto_uv3.persistence",
  "auto_uv3.q2rtx",
  "auto_uv3.recovery",
  "auto_uv3.scan_mode",
  "auto_uv3.shared",
  "auto_uv3.ui",
  "cli",
  "initial_check",
  "lact",
  "manual_fan_curve_editor",
  "manual_uv_curve_editor",
  "runtime_fan_control",
  "runtime_gpu_control",
  "runtime_stability_test",
  "saved_profile_verification",
  "saved_uv_profiles",
  "ui",
  "ui.assets",
  "ui.components",
  "ui.controllers",
  "ui.dialogs",
  "stability",
  "stability.q2rtx",
]

[tool.setuptools.package-data]
"ui.assets" = [
  "*.png",
]

[tool.setuptools.data-files]
"share/penguin-burner" = [
  "PenguinBurner.service",
  "penguin_burner.sh",
]
"share/applications" = [
  "packaging/linux/io.github.jpietek.PenguinBurner.desktop",
]
"share/icons/hicolor/256x256/apps" = [
  "packaging/icons/hicolor/256x256/apps/penguin-burner.png",
]
"share/icons/hicolor/512x512/apps" = [
  "packaging/icons/hicolor/512x512/apps/penguin-burner.png",
]
