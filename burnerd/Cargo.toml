[package]
name = "penguin-burnerd"
version = "0.8.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-only"
description = "PenguinBurner root daemon: socket API + native runtime profile engine (NVML/NVAPI)"

[[bin]]
name = "penguin-burnerd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
libloading = "0.8"
nix = { version = "0.31.3", features = ["fs", "poll", "process", "signal", "socket", "user"] }
nvml-wrapper = "=0.12.0"
procfs = { version = "0.18.0", default-features = false }
sd-notify = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared_child = { version = "1.1.1", features = ["timeout"] }
signal-hook = "0.4.4"
tempfile = "=3.20.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
